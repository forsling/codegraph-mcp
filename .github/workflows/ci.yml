name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Index fixture
        run: node dist/cli.js index fixtures/basic
      - name: Exercise MCP over stdio
        run: node test/smoke.mjs
      - name: Self-index repository
        run: node dist/cli.js index . .self-codegraph.sqlite
      - name: Dogfood MCP against codegraph itself
        env:
          CODEGRAPH_METRICS_FILE: .dogfood-metrics.jsonl
        run: node test/self-dogfood.mjs
      - name: Summarize server retrieval telemetry
        run: node benchmark/summarize-metrics.mjs .dogfood-metrics.jsonl
