name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check in generated lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Add npm lockfile"
            git push
          fi
      - run: npm run check
      - run: npm run build
      - name: Index fixture
        run: node dist/cli.js index fixtures/basic
      - name: Exercise MCP over stdio
        run: node test/smoke.mjs
      - name: Self-index repository
        run: node dist/cli.js index . .self-codegraph.sqlite
      - name: Dogfood MCP against codegraph itself
        env:
          CODEGRAPH_METRICS_FILE: .dogfood-metrics.jsonl
        run: node test/self-dogfood.mjs
      - name: Summarize server retrieval telemetry
        run: node benchmark/summarize-metrics.mjs .dogfood-metrics.jsonl
